[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-supervisor"
version = "0.2.0"
description = "Local benchmark supervisor for planner and harness generated task runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["codex", "benchmark", "supervisor", "scoring", "routing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
codex-task-supervisor = "codex_task_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
