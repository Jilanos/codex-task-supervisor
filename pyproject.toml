[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-supervisor"
version = "0.1.0"
description = "Local benchmark supervisor for planner and harness generated task runs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "codex-task-supervisor contributors" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
codex-task-supervisor = "codex_task_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
